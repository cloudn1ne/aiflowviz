<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LiteLLM Routing Sankey</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>LiteLLM → Routing Sankey</h1>
    <div class="controls">
      <label>
        Timeframe
        <select id="range" title="Quick timeframe presets">
          <option value="1h">Last 1 hour</option>
          <option value="6h">Last 6 hours</option>
          <option value="12h">Last 12 hours</option>
          <option value="24h" selected>Last 24 hours</option>
          <option value="3h">Last 3 hours</option>
          <option value="7d">Last 7 days</option>
          <option value="14d">Last 14 days</option>
          <option value="30d">Last 30 days</option>
        </select>
      </label>
      <label>
        Edge weight
        <select id="weight" title="What makes a band thicker">
          <option value="requests">Request count</option>
          <option value="tokens" selected>Total tokens</option>
          <option value="prompt_tokens">Prompt tokens</option>
          <option value="completion_tokens">Output tokens</option>
          <option value="spend">Spend ($)</option>
        </select>
      </label>
      <label class="autorefresh">
        <input id="autoCheck" type="checkbox" title="Auto-refresh the chart" />
        <span>Auto-refresh</span>
        <select id="autoInterval" title="Refresh interval">
          <option value="60000" selected>1 min</option>
          <option value="300000">5 min</option>
          <option value="1800000">30 min</option>
          <option value="3600000">60 min</option>
        </select>
      </label>
      <button id="refresh">Refresh</button>
    </div>
  </header>


  <div class="chart-wrap">
    <div class="records-info" id="recordsInfo">…</div>
    <div class="zoom-bar">
      <label for="zoom">Zoom</label>
      <input id="zoom" type="range" min="50" max="100" step="5" value="100" title="Scale the chart (50% – 100%)" />
      <span id="zoomValue">100%</span>
    </div>
    <div class="load-progress" id="loadProgress" hidden>
      <div class="load-progress-fill" id="loadProgressFill"></div>
    </div>
    <div id="chart">
      <div class="loading-overlay" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading…</div>
      </div>
      <div class="chart-error" id="chartError" hidden></div>
    </div>
    <div class="download-bar">
      <button id="download" type="button">Download chart (SVG)</button>
    </div>
    <button id="detailMode" type="button" class="detail-mode" hidden>Detail Mode On</button>
  </div>

  <div class="warnings" id="warnings"></div>

  <!-- Import map: resolve the bare 'apexsankey' specifier to the installed ESM build, so no bundler is needed. -->
  <script type="importmap">
    {
      "imports": {
        "apexsankey": "./node_modules/apexsankey/apexsankey.es.min.js"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
